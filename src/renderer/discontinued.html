<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Client - serviço descontinuado</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #2c1a1a 0%, #101114 48%, #08090c 100%);
      color: #f4f4f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .panel {
      width: min(640px, 100%);
      padding: 42px 40px 34px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(22, 22, 24, 0.94);
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.4);
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 20px;
      background: rgba(248, 113, 113, 0.08);
      font-size: 34px;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #f87171;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 16px; font-size: 27px; line-height: 1.25; }
    .message {
      max-width: 510px;
      margin: 0 auto;
      color: #d4d4d8;
      font-size: 16px;
      line-height: 1.65;
    }
    .footer {
      margin-top: 28px;
      color: #a1a1aa;
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 520px) {
      .panel { padding: 34px 24px 28px; }
      h1 { font-size: 23px; }
      .message { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="panel" aria-live="polite">
    <div class="mark" aria-hidden="true">!</div>
    <p class="eyebrow">Aviso importante</p>
    <h1>Este serviço foi descontinuado</h1>
    <p class="message">
      O Rover Client e o serviço remoto associado não estão mais disponíveis.
      A funcionalidade do app foi encerrada e não há mais suporte para a versão ativa.
    </p>
    <div class="footer">
      Para obter ajuda ou alternativas, entre em contato com o responsável pelo projeto.
    </div>
  </main>
</body>
</html>
