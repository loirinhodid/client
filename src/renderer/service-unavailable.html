<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Client - serviço indisponível</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, #272317 0%, #101114 48%, #08090c 100%);
      color: #f4f4f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .panel {
      width: min(640px, 100%);
      padding: 42px 40px 34px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(22, 22, 24, 0.94);
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.4);
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(250, 204, 21, 0.3);
      border-radius: 20px;
      background: rgba(250, 204, 21, 0.1);
    }
    .mark img { width: 42px; height: 42px; object-fit: contain; }
    .eyebrow {
      margin: 0 0 12px;
      color: #facc15;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 16px; font-size: 27px; line-height: 1.25; }
    .message {
      max-width: 490px;
      margin: 0 auto;
      color: #a1a1aa;
      font-size: 16px;
      line-height: 1.65;
    }
    .checking {
      min-height: 24px;
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #71717a;
      font-size: 13px;
    }
    .spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(250, 204, 21, 0.25);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 520px) {
      .panel { padding: 34px 24px 28px; }
      h1 { font-size: 23px; }
      .message { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main class="panel" aria-live="polite">
    <div class="mark">
      <img src="../../public/assets/n.png" alt="" />
    </div>
    <p class="eyebrow">Aviso do Rover Client</p>
    <h1>Os servidores não estão respondendo</h1>
    <p class="message">
      Não foi possível conectar ao serviço do Rover Client neste momento.
      O aplicativo continuará verificando e abrirá tudo automaticamente quando
      os servidores estiverem disponíveis novamente.
    </p>
    <div class="checking">
      <span class="spinner" aria-hidden="true"></span>
      <span>Verificação automática em andamento</span>
    </div>
  </main>
</body>
</html>
