<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Client - sem internet</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #18212d 0%, #06070b 70%);
      color: #f4f4f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .panel {
      width: min(440px, calc(100vw - 40px));
      padding: 36px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: rgba(12, 15, 20, 0.9);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    img { width: 112px; height: 112px; object-fit: contain; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.5; }
    .actions { display: flex; justify-content: center; gap: 10px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      color: #111827;
      background: #38bdf8;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    #exit { color: #e2e8f0; background: #334155; }
    #exit:hover { background: #475569; }
  </style>
</head>
<body>
  <main class="panel">
    <img src="../../public/assets/n.png" alt="Ícone do Rover Client" />
    <h1>Rover Client</h1>
    <p>Conecte-se à internet para continuar.</p>
    <div class="actions">
      <button id="retry" type="button">Tentar novamente</button>
      <button id="exit" type="button">Sair</button>
    </div>
  </main>
  <script>
    const retryButton = document.getElementById('retry');

    async function tentarReconectar() {
      const result = await window.electronAPI.tentarReconectar();
      if (result.online) clearInterval(retryInterval);
    }

    retryButton.addEventListener('click', tentarReconectar);
    document.getElementById('exit').addEventListener('click', () => window.electronAPI.sair());

    const retryInterval = setInterval(tentarReconectar, 3000);
  </script>
</body>
</html>
