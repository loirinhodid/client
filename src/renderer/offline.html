<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Client - sem internet</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #18212d 0%, #06070b 70%);
      color: #f4f4f5;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .panel {
      width: min(440px, calc(100vw - 40px));
      padding: 36px 32px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: rgba(12, 15, 20, 0.9);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    img { width: 112px; height: 112px; object-fit: contain; margin-bottom: 20px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 24px; color: #cbd5e1; line-height: 1.5; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      color: #111827;
      background: #38bdf8;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <main class="panel">
    <img src="../../public/assets/logo.svg" alt="Logotipo do Rover Client" />
    <h1>Rover Client</h1>
    <p>Não foi possível iniciar o aplicativo porque não há conexão com a internet.</p>
    <button id="retry" type="button">Tentar novamente</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', async () => {
      const result = await window.electronAPI.tentarReconectar();
      if (!result.online) alert('Ainda não há conexão com a internet.');
    });
  </script>
</body>
</html>
