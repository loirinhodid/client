name: Publish on tag

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon
        run: npm run build-icon

      - name: Remove existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}"
          if ($LASTEXITCODE -eq 0) {
            gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes
          }

      - name: Publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: npm run publish

      - name: Add build revision to update manifest
        run: node scripts/add-update-revision.js

      - name: Update manifest on GitHub release
        env:
          GH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/latest.yml --clobber
